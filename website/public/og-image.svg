<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <g opacity="0.1">
    <line x1="0" y1="157" x2="1200" y2="157" stroke="#a855f7" stroke-width="1"/>
    <line x1="0" y1="315" x2="1200" y2="315" stroke="#a855f7" stroke-width="1"/>
    <line x1="0" y1="473" x2="1200" y2="473" stroke="#a855f7" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="630" stroke="#a855f7" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke="#a855f7" stroke-width="1"/>
    <line x1="900" y1="0" x2="900" y2="630" stroke="#a855f7" stroke-width="1"/>
  </g>

  <!-- Logo/Title -->
  <text x="600" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="120" font-weight="bold" fill="url(#textGradient)" text-anchor="middle">DTRules</text>

  <!-- Tagline -->
  <text x="600" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="36" fill="#94a3b8" text-anchor="middle">Decision Table Rules Engine</text>

  <!-- Features -->
  <text x="600" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#64748b" text-anchor="middle">Java &amp; Go | 75+ Operators | Excel Authoring</text>

  <!-- Decorative table icon -->
  <g transform="translate(540, 480)" opacity="0.3">
    <rect x="0" y="0" width="120" height="80" rx="4" fill="none" stroke="#a855f7" stroke-width="2"/>
    <line x1="40" y1="0" x2="40" y2="80" stroke="#a855f7" stroke-width="1"/>
    <line x1="80" y1="0" x2="80" y2="80" stroke="#a855f7" stroke-width="1"/>
    <line x1="0" y1="26" x2="120" y2="26" stroke="#a855f7" stroke-width="1"/>
    <line x1="0" y1="53" x2="120" y2="53" stroke="#a855f7" stroke-width="1"/>
  </g>
</svg>
