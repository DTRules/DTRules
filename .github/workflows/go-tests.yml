name: Go Tests

on:
  push:
    branches: [5.0-SNAPSHOT, main]
  pull_request:

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.24']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go ${{ matrix.go-version }}
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}

    - name: Run scoped build + tests (matches `make check`)
      # The root pkg/dtrules/ package has pre-existing failures driven by
      # DSL idioms the EL compiler doesn't yet fully handle (e.g.
      # "for all <entityName> entities" as a context). `make check`
      # excludes those known failures. CI follows the same scope so
      # a green CI means "the scoped local check passed" rather than
      # a false negative on work already tracked as known-failing.
      #
      # GOTESTFLAGS=-short skips the heavyweight integration tests (notably
      # loading the full 523-table TaxReturn project, ~50s) that dominated
      # CI wall-time and were the long pole behind the runner being killed
      # mid-suite (#870). The full suite still runs in a plain `make check`
      # locally and in the release workflow. timeout-minutes turns any true
      # hang into a clear failure instead of a vague runner shutdown.
      run: make check GOTESTFLAGS=-short
      timeout-minutes: 15

    - name: Build CLI
      run: go build -o build/dtrules ./cmd/dtrules/

    - name: Validate CHIP sampleproject
      run: ./build/dtrules validate sampleprojects/CHIP
