name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    # A true hang fails clearly instead of a silent runner shutdown that skips
    # the "Create GitHub Release" step (the failure mode behind every prior
    # release run being red while the tag still landed).
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Run checks
        # The project's gate: full build + vet + the curated test suite. Bare
        # `go test ./...` pulled in packages excluded on purpose (pre-existing
        # tax-content / forall fixtures that lack compiled postfix — #520), so
        # every release run failed at the test step. `make check` is the gate
        # contributors run; the release uses the same one.
        run: make check

      - name: Set version info
        id: version
        run: |
          echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build release binaries
        env:
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT:  ${{ steps.version.outputs.commit }}
          DATE:    ${{ steps.version.outputs.date }}
        run: make release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/dtrules-linux-amd64
            dist/dtrules-linux-arm64
            dist/dtrules-darwin-amd64
            dist/dtrules-darwin-arm64
            dist/dtrules-windows-amd64.exe
            dist/checksums.txt
          generate_release_notes: true
