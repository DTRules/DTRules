name: verify

on:
  pull_request:
    # Anything that can change what a rule is, or how one is written out.
    #
    # authoring/ and apiserver/ were missing, and they are the two packages
    # that write rules. #1077 — the Excel refresh writing every table into
    # every workbook — shipped through this filter without the gate ever
    # running. loader/ decides what the XML means, so it belongs here too.
    paths:
      - 'sampleprojects/**'
      - 'pkg/dtrules/authoring/**'
      - 'pkg/dtrules/apiserver/**'
      - 'pkg/dtrules/excel/**'
      - 'pkg/dtrules/loader/**'
      - 'pkg/dtrules/sync/**'
      - 'cmd/dtrules/**'
      - '.github/workflows/verify.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build dtrules binary
        run: go build -o /tmp/dtrules ./cmd/dtrules/

      # Every sample is verified. The exclusions this list replaces had gone
      # stale: CHIP, ChipApp, KidAid and TestProject were skipped as "legacy /
      # not maintained" and all four verify clean, DTEligibility no longer
      # exists, and TaxReturn was called an archived sample when it is the
      # largest one we have. Skipping the projects that break is how #1064
      # shipped a TaxReturn whose every workbook held all 205 sheets.
      #
      # Every sample is verified, and every sample passes. The exclusion list
      # this replaces had three entries; they are gone rather than waived:
      #
      #   CorporateTax  NV compared a string field against bare words the
      #                 compiler read as operator names.
      #   SyntaxTests   reported for performing an undefined
      #                 `Error_handling_table` while defining
      #                 `Error_Handling_Table` in the same file -- one name in
      #                 a case-insensitive language, compared case-sensitively
      #                 by the call-graph pass.
      #   TaxReturn     23 references to things nobody declared, from field
      #                 near-misses (`property_sale.gain` for
      #                 `total_gain_loss`) to whole calculations left as
      #                 placeholders. Authored from the IRS forms (#1012).
      #
      # Skipping the projects that break is how #1064 shipped a TaxReturn whose
      # every workbook held all 205 sheets. There is nothing to skip now; if a
      # sample fails here, that is a regression, not a known defect.
      - name: Verify samples
        run: |
          set -u
          failed=0
          for dir in sampleprojects/*/; do
            name=$(basename "$dir")
            [ -d "${dir}excel" ] || { echo "· $name has no excel/, skipping"; continue; }
            echo "· Verifying $name"
            if ! /tmp/dtrules verify "$dir"; then
              failed=1
            fi
          done
          exit $failed
