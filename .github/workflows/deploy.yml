name: Deploy Website                                                                                                   
                                                                                                                         
  on:                                                                                                                    
    workflow_dispatch:                                                                                                   
                                                                                                                         
  permissions:                                                                                                           
    contents: read                                                                                                       
    pages: write                                                                                                         
    id-token: write                                                                                                      
                                                                                                                         
  jobs:                                                                                                                  
    build:                                                                                                               
      runs-on: ubuntu-latest                                                                                             
      steps:                                                                                                             
        - uses: actions/checkout@v4                                                                                      
                                                                                                                         
        - uses: actions/setup-node@v4                                                                                    
          with:                                                                                                          
            node-version: 20                                                                                             
                                                                                                                         
        - name: Build                                                                                                    
          run: |                                                                                                         
            cd website                                                                                                   
            npm ci                                                                                                       
            npm run build                                                                                                
                                                                                                                         
        - uses: actions/upload-pages-artifact@v3                                                                         
          with:                                                                                                          
            path: website/dist                                                                                           
                                                                                                                         
    deploy:                                                                                                              
      needs: build                                                                                                       
      runs-on: ubuntu-latest                                                                                             
      environment:                                                                                                       
        name: github-pages                                                                                               
      steps:                                                                                                             
        - uses: actions/deploy-pages@v4
